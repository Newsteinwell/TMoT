[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmot"
version = "0.1.0"
description = "Time-series Moment Transport for continual learning"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "torch>=2.2"]

[project.optional-dependencies]
features = ["mantis-tsfm", "huggingface-hub"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["tmot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
